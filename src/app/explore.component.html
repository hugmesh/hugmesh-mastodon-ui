<section class="explore-view" data-testid="explore-view" aria-labelledby="explore-heading">
  <header class="column-head"><h2 id="explore-heading">Explore</h2></header>

  <nav class="explore-tabs" aria-label="Trending categories">
    <button
      type="button"
      data-testid="explore-tab-posts"
      [class.active]="tab() === 'posts'"
      [attr.aria-pressed]="tab() === 'posts'"
      (click)="selectTab('posts')"
    >
      Posts
    </button>
    <button
      type="button"
      data-testid="explore-tab-tags"
      [class.active]="tab() === 'tags'"
      [attr.aria-pressed]="tab() === 'tags'"
      (click)="selectTab('tags')"
    >
      Hashtags
    </button>
    <button
      type="button"
      data-testid="explore-tab-links"
      [class.active]="tab() === 'links'"
      [attr.aria-pressed]="tab() === 'links'"
      (click)="selectTab('links')"
    >
      News
    </button>
  </nav>

  <p *ngIf="loading()" class="loading" role="status">Loading…</p>

  <div *ngIf="tab() === 'posts'" class="explore-posts" data-testid="explore-panel-posts">
    <hug-mastodon-toot-card
      *ngFor="let s of posts(); trackBy: trackId"
      [status]="s"
    ></hug-mastodon-toot-card>
  </div>

  <div *ngIf="tab() === 'tags'" class="explore-tags" data-testid="explore-panel-tags">
    <a
      class="trending-tag"
      data-testid="explore-trending-tag"
      *ngFor="let t of tags()"
      [routerLink]="['/tags', t.name]"
    >
      #{{ t.name }}
    </a>
  </div>

  <div *ngIf="tab() === 'links'" class="explore-links" data-testid="explore-panel-links">
    <a class="trending-link" *ngFor="let l of links()" [href]="l.url" target="_blank" rel="noopener">
      <img *ngIf="l.image" [src]="l.image" [alt]="l.title" />
      <span class="link-title">{{ l.title }}</span>
      <span class="link-provider">{{ l.provider_name }}</span>
      <span class="sr">(opens in a new tab)</span>
    </a>
  </div>

  <button
    *ngIf="!loading() && !exhausted()"
    type="button"
    class="load-more"
    data-testid="explore-load-more"
    (click)="loadMore()"
  >
    Load more
  </button>
</section>
