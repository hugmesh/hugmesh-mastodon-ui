<section class="status-detail" data-testid="status-detail" aria-label="Conversation thread">
  @if (loading()) {
    <p class="loading" role="status">Loading…</p>
  }

  @if (context().ancestors.length) {
    <div class="ancestors" data-testid="status-ancestors" aria-label="Replied to">
      @for (a of context().ancestors; track trackId($index, a)) {
        <hug-mastodon-toot-card
          [status]="a"
        ></hug-mastodon-toot-card>
      }
    </div>
  }

  @if (focused(); as f) {
    <div class="focused" data-testid="status-focused">
      <hug-mastodon-toot-card [status]="f" [focused]="true"></hug-mastodon-toot-card>
    </div>
  }

  @if (focused(); as f) {
    <div class="reply-box" data-testid="status-reply-box">
      <hug-mastodon-compose-box
        [inReplyToId]="f.id"
        placeholder="Post your reply"
        (posted)="onReplyPosted()"
      ></hug-mastodon-compose-box>
    </div>
  }

  @if (context().descendants.length) {
    <div class="descendants" data-testid="status-descendants" aria-label="Replies">
      @for (d of context().descendants; track trackId($index, d)) {
        <hug-mastodon-toot-card
          [status]="d"
        ></hug-mastodon-toot-card>
      }
    </div>
  }
</section>
