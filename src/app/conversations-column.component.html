<section class="conversations-column" data-testid="conversations-column" aria-labelledby="conversations-heading">
  <header class="column-head"><h2 id="conversations-heading">Direct messages</h2></header>

  <p *ngIf="loading() && !items().length" class="loading" role="status">Loading…</p>
  <p *ngIf="!loading() && !items().length" class="empty" role="status">No conversations.</p>

  <ul class="conversation-list" [attr.aria-busy]="loading()">
    <li
      class="conversation-item"
      data-testid="conversation-item"
      *ngFor="let c of items(); trackBy: trackId"
      [class.unread]="c.unread"
    >
      <div class="conversation-participants">
        <span *ngIf="c.unread" class="unread-dot" data-testid="conversation-unread" aria-hidden="true">●</span>
        <span *ngIf="c.unread" class="sr">Unread.</span>
        <span class="participants">{{ participantNames(c) }}</span>
      </div>
      <snap-mastodon-toot-card *ngIf="c.last_status" [status]="c.last_status"></snap-mastodon-toot-card>
      <div class="conversation-reply" *ngIf="replyingTo() === c.id && c.last_status">
        <snap-mastodon-compose-box
          [inReplyToId]="c.last_status.id"
          defaultVisibility="direct"
          placeholder="Reply privately"
          (posted)="onReplied()"
        ></snap-mastodon-compose-box>
      </div>
      <button
        type="button"
        class="reply-toggle"
        [attr.aria-expanded]="replyingTo() === c.id"
        (click)="toggleReply(c.id)"
      >
        {{ replyingTo() === c.id ? 'Cancel' : 'Reply' }}
      </button>
    </li>

    <li *ngIf="items().length && !exhausted()" class="load-more-row">
      <button
        type="button"
        class="load-more"
        (click)="loadMore()"
        [disabled]="loading()"
        [attr.aria-busy]="loading()"
      >
        {{ loading() ? 'Loading…' : 'Load more' }}
      </button>
    </li>
  </ul>
</section>
