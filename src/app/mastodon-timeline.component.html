<section class="snap-mastodon mastodon-column" data-testid="mastodon-view" aria-labelledby="timeline-heading">
  <header class="column-head">
    <h2 id="timeline-heading">{{ title() }}</h2>
    <snap-mastodon-appearance-panel></snap-mastodon-appearance-panel>
  </header>

  @if (source === 'home') {
    <snap-mastodon-compose-box
      (posted)="onPosted($event)"
    ></snap-mastodon-compose-box>
  }

  <div data-testid="mastodon-timeline" class="timeline-list" role="feed" [attr.aria-busy]="loading()">
    @if (loading() && !toots().length) {
      <p class="timeline-loading" role="status">Loading…</p>
    }
    @if (!loading() && !toots().length) {
      <p
        class="timeline-empty"
        data-testid="timeline-empty"
        role="status"
        >
        Nothing here yet.
      </p>
    }

    @for (t of toots(); track trackId($index, t)) {
      <snap-mastodon-toot-card
        [status]="t"
        (reply)="goToStatus($event)"
        (hashtagClick)="goToHashtag($event)"
      ></snap-mastodon-toot-card>
    }

    @if (toots().length && canLoadMore()) {
      <button
        type="button"
        class="load-more"
        data-testid="timeline-load-more"
        (click)="loadMore()"
        [disabled]="loading()"
        [attr.aria-busy]="loading()"
        >
        {{ loading() ? 'Loading…' : 'Load more' }}
      </button>
    }
  </div>
</section>
