name: Unit Tests

# Headless Karma/Jasmine unit tests for the snapdragon-mastodon-ui
# native-federation remote (remote name "mastodon", exposes ./routes).
# Mirrors the org-wide hygiene template: every component/service/route ships
# meaningful specs, run on Chrome headless via the ChromeHeadlessCI launcher
# defined in karma.conf.js.
#
# NOTE: Angular CLI 22 requires Node >= 24.15, so this job pins Node 24.16.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: npm

      - name: Install Chrome (for ChromeHeadlessCI)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (headless)
        run: npm test
        env:
          # browser-actions/setup-chrome exports the chrome path; karma's
          # ChromeHeadlessCI launcher (--no-sandbox --disable-dev-shm-usage) uses it.
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
