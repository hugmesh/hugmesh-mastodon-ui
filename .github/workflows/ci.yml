name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Angular CLI 22 requires Node >= 24.15.
          node-version: "24.16.0"
      - run: npm install --no-audit --no-fund
      - run: npm run build
