# Per-response CSP nonce source. $request_id is a unique 32-hex token nginx
# generates for every request, so each response gets a fresh, unpredictable
# nonce that is injected into BOTH the Content-Security-Policy header and every
# inline <script> tag below — defeating CSP nonce reuse / replay.
map $request_id $cspnonce {
    default $request_id;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (defence-in-depth) ───────────────────────────────────
    # Inspection-safe for an Angular SPA + module-federation remotes + OAuth
    # redirect flows: none of these block same-origin scripts, cross-origin
    # script-based federation, or redirect-based login. Emitted with `always` so
    # they also cover error responses.
    #   - nosniff: stop MIME-type sniffing.
    #   - X-Frame-Options DENY: clickjacking protection. DENY mirrors the CSP
    #     frame-ancestors 'none' below (module federation loads remotes via
    #     <script>, not iframes, so framing is never required) — keeping the two
    #     framing controls consistent rather than contradictory.
    #   - Referrer-Policy: don't leak full URLs cross-origin.
    #   - HSTS: pin HTTPS for a year incl. subdomains (only affects HTTPS responses).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Native-federation remote: the hugmesh.net host fetches
    # remoteEntry.json + the shared/exposed chunks cross-origin, so allow CORS
    # on every bundle this remote serves.
    #
    # Content-Security-Policy (STRONG nonce-based XSS backstop): even though
    # toot/profile HTML is sanitized by Angular before rendering, a strict CSP
    # stops any injected inline script from executing. This UI carries NO
    # 'unsafe-inline' / 'unsafe-hashes' in script-src — instead a per-response
    # nonce ($cspnonce) is stamped into both the header AND every '<script' tag
    # (see sub_filter below); es-module-shims (>=2.x) auto-propagates that nonce
    # to the module scripts it injects, so the bootstrap chain stays nonce-clean.
    #   - default-src 'self'                       : same-origin default.
    #   - script-src 'self' 'nonce-$cspnonce' blob: : only same-origin + this
    #                                         request's nonce'd inline scripts;
    #                                         blob: for worker/module blobs.
    #   - style-src 'self' 'unsafe-inline' blob:   : Angular inlines component
    #                                         styles (inlineCritical disabled in
    #                                         the build, so NO inline <style>/onload
    #                                         in index.html), but runtime style
    #                                         injection still needs 'unsafe-inline'.
    #   - img-src 'self' data: blob: https:        : federated avatars/media are
    #                                         remote https: URLs bound into <img>,
    #                                         plus data:/blob: previews — REQUIRED.
    #   - font-src 'self' data:                    : webfonts incl. inlined data: fonts.
    #   - connect-src 'self' blob: https: wss:     : BFF/gateway/Mastodon origins are
    #                                         env-configured (MASTODON_BASE_URL etc.)
    #                                         and remote media may be fetched, so
    #                                         https:/wss:/blob: are REQUIRED.
    #   - worker-src 'self' blob:                  : blob-backed web/module workers.
    #   - base-uri 'self'                          : stop <base> tag hijacking.
    #   - object-src 'none'                        : block <object>/<embed>.
    #   - frame-ancestors 'none'                   : no framing (mirrors XFO DENY).
    # NOTE: nginx add_header does NOT merge across blocks — a child block with any
    # add_header discards inherited ones — so the CSP + security headers are set
    # here, in the block that actually serves index.html (where XSS would run).
    # Runtime theme (fleet 50-snap-theme.sh mechanism): served from /tmp — the
    # entrypoint hook's SNAP_THEME_OUT — via an exact-match alias, so the SPA
    # catch-all can never shadow it and an empty theme is a zero-byte 200
    # (shipped brand), never an index.html masquerading as a stylesheet.
    # no-store: a rebrand is env + restart; a cached copy would pin the brand.
    location = /snap-theme.css {
        alias /tmp/snap-theme.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
        # Re-emit server-scope security headers (add_header does not merge).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # RENAME PHASE 1 — the SAME file under the NEW name. The entrypoint hook
    # writes both spellings byte-for-byte (see docker-entrypoint.d/50-snap-theme.sh),
    # so an index.html from either era resolves and neither URL can 404 while the
    # fleet-wide SNAP_* -> HUG_* rename is in flight. Directives mirror the block
    # above exactly — same no-store, same re-emitted security headers.
    location = /hug-theme.css {
        alias /tmp/hug-theme.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
        # Re-emit server-scope security headers (add_header does not merge).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        add_header Access-Control-Allow-Origin "*" always;
        # Stamp this request's nonce into EVERY inline <script> tag of index.html.
        # sub_filter_once OFF so all script tags are rewritten; restricted to
        # text/html so the hashed JS bundles are never touched. (Do NOT enable
        # gzip_static / precompressed index.html — sub_filter cannot rewrite a
        # pre-gzipped response.)
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<script' '<script nonce="$cspnonce"';
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$cspnonce' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: https: wss:; worker-src 'self' blob:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        # nginx add_header does NOT merge across blocks: because this location has
        # its own add_header above, it discards the server-scope security headers,
        # so they are repeated here to keep covering SPA responses.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
        # Same add_header non-merge rule: re-emit the server-scope security headers
        # so the health endpoint's responses keep them too.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
