server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Native-federation remote: the snapdragon.systems host fetches
    # remoteEntry.json + the shared/exposed chunks cross-origin, so allow CORS
    # on every bundle this remote serves.
    #
    # XSS backstop: even though toot/profile HTML is sanitized by Angular before
    # rendering, a strict Content-Security-Policy stops any injected inline
    # script from executing. script-src 'self' blocks inline/remote script;
    # object-src none blocks <object>/<embed>; base-uri 'self' stops <base> tag
    # hijacking. NOTE: nginx add_header does NOT merge across blocks — a child
    # block with any add_header discards inherited ones — so the CSP is set here,
    # in the block that actually serves index.html (where XSS would run).
    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
